name: 发布订单业务标签治理评审站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包公网评审站点
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html prototype.html prd.md _site/
          cp assets/admin-shell.css _site/assets/
          cp assets/admin-shell.js _site/assets/
          cp assets/app.css _site/assets/
          cp assets/app.js _site/assets/
          cp assets/docs.css _site/assets/
          cp assets/state-v2.js _site/assets/

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
